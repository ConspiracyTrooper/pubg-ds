features:
  # Сопоставимый режим: датасет squad-fpp = live ranked
  match_type: squad-fpp

train:
  # Единый сид на весь проект: сплит по matchId и рандом модели
  random_state: 1
  test_size: 0.1
  val_size: 0.1
  cv_folds: 3
  # Потолок деревьев, реальное число режет early stopping по val
  n_estimators: 2000

tune:
  n_trials: 30
  # Пространство поиска Optuna: type + границы [low, high] (+log для лог-шкалы)
  search_space:
    learning_rate:     {type: float, low: 0.05,  high: 0.2, log: true}
    num_leaves:        {type: int,   low: 31,    high: 255}
    max_depth:         {type: int,   low: 4,     high: 12}
    min_child_samples: {type: int,   low: 20,    high: 200}
    subsample:         {type: float, low: 0.6,   high: 1.0}
    colsample_bytree:  {type: float, low: 0.6,   high: 1.0}
    reg_alpha:         {type: float, low: 0.001, high: 10.0, log: true}
    reg_lambda:        {type: float, low: 0.001, high: 10.0, log: true}

collect:
  # Сколько уникальных ranked-матчей собрать в live-окно
  n_matches: 300
  game_mode: squad-fpp
  # Игроки/матчи — на платформенном shard'е, лидерборды — на региональном
  shard: steam
  leaderboard_shard: pc-eu
  # Сноуболл от своих матчей; пустой список → fallback на топ-500 лидерборда
  seed_player_names: []
  max_snowball_players: 600

monitor:
  # Пороги PSI: < 0.1 стабильно, 0.1–0.25 умеренный сдвиг, >= 0.25 сильный дрифт
  psi_moderate: 0.1
  psi_strong: 0.25
  # Бинов для PSI (по квантилям reference) и сглаживание нулевых долей
  psi_bins: 10
  psi_eps: 0.0001

retrain:
  # Сплит live по matchId: test для сравнения + val для early stopping
  random_state: 1
  test_size: 0.2
  val_size: 0.15